plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion

    // Nexus Menu Map (Antipixel) built from source, only so `gradlew run` can load the
    // host plugin next to this addon. Never part of the shipped plugin.
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
}

group = 'com.zoomoutnexus'
version = '1.0.0'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Launches RuneLite with Nexus Menu Map + this addon loaded'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zoomoutnexus.ZoomOutNexusPluginTest'
    // ExternalPluginManager.loadBuiltin refuses to run without assertions enabled.
    jvmArgs = ['-ea']
    args = ['--debug', '--developer-mode']
}
